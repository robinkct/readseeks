<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReadSeeks — 3D Travel Diary & Spinning Earth</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Ambient Cosmic Nebula Glow -->
  <div class="cosmic-backdrop"></div>

  <!-- 3D Spinning Globe Canvas -->
  <div id="globeViz"></div>

  <!-- Top Glassmorphism Navigation Bar -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon-box">🌍</div>
      <div class="brand-text">
        <h1>ReadSeeks</h1>
        <p>Robin's Travel Chronicles</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="header-actions">
      <button class="btn-header" id="btn-open-countdown" title="查看啟程倒數通知">
        <span>⏳</span>
        <span>啟程通知</span>
      </button>
      <button class="btn-header" id="btn-open-drawer" title="Open Destination Index">
        <span>🗂️</span>
        <span>Travel Index</span>
      </button>
      <button class="btn-header primary" id="btn-add-journey" title="Add a New Journey" style="display: none;">
        <span>✦</span>
        <span>Add Journey</span>
      </button>
    </div>
  </header>

  <!-- Collapsible Bottom Controls HUD (Defaults to collapsed ">") -->
  <div class="hud-container collapsed" id="hud-container">
    <!-- Expand / Collapse Toggle Button (Defaults to '>') -->
    <button class="hud-toggle-btn" id="btn-toggle-hud" title="展開 / 收合控制欄" aria-label="Controls">
      <span id="hud-toggle-icon">&gt;</span>
    </button>

    <!-- Collapsible Controls Bar -->
    <div class="hud-bar" id="hud-bar">
      <!-- Country Map Group -->
      <div class="hud-group">
        <button class="hud-btn active" id="btn-toggle-countries" title="國家色塊地圖 (開/關)">
          <span>🗺️</span>
          <span class="hud-label-text">地圖</span>
        </button>
        <select class="hud-select" id="select-country-style" title="國家地圖色彩風格">
          <option value="blocks">多彩色塊</option>
          <option value="visited">足跡高亮</option>
          <option value="continents">大洲分區</option>
        </select>
      </div>

      <div class="hud-divider"></div>

      <!-- Routes & Texture Group -->
      <div class="hud-group">
        <button class="hud-btn active" id="btn-toggle-routes" title="飛行航線 (開/關)">
          <span>✈️</span>
          <span class="hud-label-text">航線</span>
        </button>
        <select class="hud-select" id="select-texture" title="地球貼圖風格">
          <option value="night">夜景光芒</option>
          <option value="blue">藍色大理石</option>
          <option value="dark">極簡黑調</option>
        </select>
      </div>

      <div class="hud-divider"></div>

      <!-- Reset Camera View (Positioned directly over Taiwan) -->
      <button class="hud-btn btn-reset-taiwan" id="btn-reset-view" title="重設視角至台灣">
        <span>🇹🇼</span>
        <span style="font-size: 11px; font-weight: 600;">Reset</span>
      </button>
    </div>
  </div>

  <!-- Slide-out Destinations Drawer (Sidebar) -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="destinations-drawer" id="destinations-drawer">
    <div class="drawer-header">
      <h2><span>🗺️</span> Travel Journal Index</h2>
      <button class="btn-drawer-close" id="btn-close-drawer">&times;</button>
    </div>
    
    <div class="drawer-search-box">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="drawer-search-input" id="drawer-search" placeholder="Search cities, countries, tags...">
      </div>
    </div>

    <div class="drawer-list" id="drawer-destinations-list">
      <!-- Dynamically populated -->
    </div>
  </aside>

  <!-- Departure Countdown Notice Modal -->
  <div class="modal-backdrop" id="countdown-modal-backdrop">
    <div class="countdown-modal" id="countdown-modal-card">
      <button class="modal-close-btn" id="btn-close-countdown" title="關閉">&times;</button>
      
      <div class="countdown-modal-header">
        <h2 class="countdown-heading">出發倒數</h2>
      </div>

      <!-- 倒數時間區塊 -->
      <div class="countdown-clock-wrapper">
        <div class="countdown-unit-box">
          <span class="countdown-digits" id="cd-days">00</span>
          <span class="countdown-label">天 DAYS</span>
        </div>
        <span class="countdown-separator">:</span>
        <div class="countdown-unit-box">
          <span class="countdown-digits" id="cd-hours">00</span>
          <span class="countdown-label">時 HOURS</span>
        </div>
        <span class="countdown-separator">:</span>
        <div class="countdown-unit-box">
          <span class="countdown-digits" id="cd-mins">00</span>
          <span class="countdown-label">分 MINS</span>
        </div>
        <span class="countdown-separator">:</span>
        <div class="countdown-unit-box">
          <span class="countdown-digits cd-seconds" id="cd-secs">00</span>
          <span class="countdown-label">秒 SECS</span>
        </div>
      </div>

      <!-- 倒數下方的心意文字 (動態由 notice.txt 載入) -->
      <div class="countdown-letter-wrapper">
        <div class="letter-body-text" id="notice-content">謝謝這段日子在生活、工作上的照顧與陪伴！

我準備去環遊世界，這是準備帶去世界各地、送給沿途相遇朋友的信物。
在啟程前，也想先遞交到你手中。

網頁現在還在倒數中，出發後會持續把沿途的風景更新上去
累了的時候，歡迎上來看看外面的世界，監督我有沒有偷懶不更新喔~</div>
      </div>

      <!-- 操作按鈕 -->
      <div class="countdown-modal-actions">
        <button type="button" class="btn-countdown-enter" id="btn-countdown-enter">
          <span>開啟世界地圖探索 🌍</span>
        </button>
      </div>

      <!-- 社群與個人連結 -->
      <div class="countdown-social-links">
        <a href="https://www.facebook.com/readseeks" target="_blank" rel="noopener noreferrer" class="social-icon-btn social-fb" title="Facebook (@readseeks)" aria-label="Facebook">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
        <a href="https://www.instagram.com/readseeks" target="_blank" rel="noopener noreferrer" class="social-icon-btn social-ig" title="Instagram (@readseeks)" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>
        <a href="https://www.youtube.com/@readseeks" target="_blank" rel="noopener noreferrer" class="social-icon-btn social-yt" title="YouTube (@readseeks)" aria-label="YouTube">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
        </a>
        <a href="https://robinkct.com" target="_blank" rel="noopener noreferrer" class="social-icon-btn social-web" title="Web (robinkct.com)" aria-label="Website">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </a>
        <a href="https://www.linkedin.com/in/robinkct" target="_blank" rel="noopener noreferrer" class="social-icon-btn social-linkedin" title="LinkedIn (robinkct)" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Full Travel Diary Reader Modal -->
  <div class="modal-backdrop" id="diary-modal-backdrop">
    <div class="diary-modal" id="diary-modal-content">
      <!-- Dynamically populated by app.js -->
    </div>
  </div>

  <!-- Add Journey Modal -->
  <div class="modal-backdrop" id="add-modal-backdrop">
    <div class="diary-modal" style="width: 580px;">
      <div class="drawer-header">
        <h2><span>✦</span> Log a New Travel Journey</h2>
        <button class="btn-drawer-close" id="btn-close-add-modal">&times;</button>
      </div>

      <form id="add-journey-form">
        <div class="add-modal-body">
          <!-- Quick City Presets -->
          <div class="form-group">
            <label class="form-label">Quick Presets (Auto-fills coordinates)</label>
            <select class="form-select" id="city-presets">
              <option value="">-- Choose a popular city or type below --</option>
              <option value="taipei">Taipei, Taiwan 🇹🇼</option>
              <option value="tokyo">Tokyo, Japan 🇯🇵</option>
              <option value="london">London, UK 🇬🇧</option>
              <option value="rome">Rome, Italy 🇮🇹</option>
              <option value="seoul">Seoul, South Korea 🇰🇷</option>
              <option value="singapore">Singapore 🇸🇬</option>
              <option value="rio">Rio de Janeiro, Brazil 🇧🇷</option>
              <option value="cape_town">Cape Town, South Africa 🇿🇦</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Destination Name *</label>
              <input type="text" class="form-input" id="form-name" placeholder="e.g. Taipei & Jiufen" required>
            </div>
            <div class="form-group">
              <label class="form-label">Country *</label>
              <input type="text" class="form-input" id="form-country" placeholder="e.g. Taiwan" required>
            </div>
            <div class="form-group" style="max-width: 70px;">
              <label class="form-label">Flag</label>
              <input type="text" class="form-input" id="form-flag" placeholder="🇹🇼">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Latitude *</label>
              <input type="number" step="any" class="form-input" id="form-lat" placeholder="25.0330" required>
            </div>
            <div class="form-group">
              <label class="form-label">Longitude *</label>
              <input type="number" step="any" class="form-input" id="form-lng" placeholder="121.5654" required>
            </div>
            <div class="form-group">
              <label class="form-label">Continent</label>
              <select class="form-select" id="form-continent">
                <option value="Asia">Asia</option>
                <option value="Europe">Europe</option>
                <option value="Americas">Americas</option>
                <option value="Africa">Africa</option>
                <option value="Oceania">Oceania</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Travel Date</label>
              <input type="text" class="form-input" id="form-date" placeholder="e.g. October 2024">
            </div>
            <div class="form-group">
              <label class="form-label">Duration</label>
              <input type="text" class="form-input" id="form-duration" placeholder="e.g. 7 Days">
            </div>
            <div class="form-group">
              <label class="form-label">Category</label>
              <select class="form-select" id="form-category">
                <option value="Culture">Culture</option>
                <option value="Nature">Nature</option>
                <option value="City">City</option>
                <option value="Adventure">Adventure</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Pin Emoji</label>
              <input type="text" class="form-input" id="form-icon" placeholder="🏮">
            </div>
            <div class="form-group" style="flex: 2;">
              <label class="form-label">Cover Image URL</label>
              <input type="url" class="form-input" id="form-cover" placeholder="https://images.unsplash.com/...">
            </div>
            <div class="form-group">
              <label class="form-label">Rating (1-5)</label>
              <input type="number" step="0.1" min="1" max="5" class="form-input" id="form-rating" value="5.0">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Summary / Float-up Quote</label>
            <input type="text" class="form-input" id="form-summary" placeholder="A short memorable quote shown on the floating card...">
          </div>

          <div class="form-group">
            <label class="form-label">Travel Journal Story</label>
            <textarea class="form-textarea" id="form-story" placeholder="Write about your adventures, sights, feelings, food recommendations..."></textarea>
          </div>
        </div>

        <div class="add-modal-footer">
          <button type="button" class="btn-header" id="btn-cancel-add">Cancel</button>
          <button type="submit" class="btn-header primary">Save Journey & Pin to Earth</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container">
    <div class="toast" id="toast">
      <span id="toast-msg">Notification</span>
    </div>
  </div>

  <!-- Globe.gl Library (Local bundle with fallback to CDN) -->
  <script src="./globe.gl.min.js"></script>
  <script>
    if (typeof Globe === 'undefined') {
      console.log('Loading Globe from CDN fallback...');
      document.write('<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2"><\/script>');
    }
  </script>

  <!-- Countries GeoJSON for Offline & Fast Polygons Layer -->
  <script src="./countries-data.js"></script>

  <!-- Application Logic -->
  <script src="./destinations.js"></script>
  <script src="./app.js"></script>
</body>
</html>
